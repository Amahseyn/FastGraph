name: CI

on:
  push:
    branches: [ main, master, maxclique ]
  pull_request:
    branches: [ main, master, maxclique ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Quote versions so YAML doesn't parse them as floats (3.10 -> 3.1)
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build extension (parallel)
        run: python setup.py build_ext --inplace --parallel $(nproc)

      - name: Show built files
        run: ls -lah | sed -n '1,200p'

      - name: Run quick smoke test
        run: |
          # Run a lightweight smoke test instead of full pytest to keep CI fast
          python scripts/smoke_test.py

  full-run:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/maxclique' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build extensions
        run: python setup.py build_ext --inplace

      - name: Run full algorithms on test graphs
        run: python scripts/run_all_algorithms.py | tee results.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: full-run-results
          path: results.txt
