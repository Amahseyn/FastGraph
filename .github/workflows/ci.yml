name: CI

on:
  push:
    branches: [ main, master, maxclique ]
  pull_request:
    branches: [ main, master, maxclique ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Quote versions so YAML doesn't parse them as floats (3.10 -> 3.1)
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build extension (parallel)
        run: python setup.py build_ext --inplace --parallel $(nproc)

      - name: Show built files
        run: ls -lah | sed -n '1,200p'

      - name: Run quick smoke test
        run: |
          # Run a lightweight smoke test instead of full pytest to keep CI fast
          python scripts/smoke_test.py
